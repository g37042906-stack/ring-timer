      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleRelease

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp project/app/build/outputs/apk/release/app-release.apk RingTimer.apk
          gh release create "build-${{ github.run_number }}" RingTimer.apk \
            --repo "${{ github.repository }}" \
            --title "Ринг-таймер, сборка ${{ github.run_number }}" \
            --notes "APK для Android 7.0 и новее."

      - uses: actions/upload-artifact@v4
        with:
          name: RingTimer-apk
          path: RingTimer.apk
